name: Deploy public website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "editor.html"
      - ".nojekyll"
      - "UPSTREAM-LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website files
        run: |
          test -s index.html
          test -s editor.html
          test -f .nojekyll
          test -s UPSTREAM-LICENSE
          grep -q "MoneyPrinterTurbo" index.html
          grep -q "MoneyPrinterTurbo" editor.html
          grep -q "harry0703/MoneyPrinterTurbo" index.html
          grep -qi "MIT" UPSTREAM-LICENSE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
