name: Deploy Ramiz Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "editor.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website files
        run: |
          test -s index.html
          test -s editor.html
          test -f .nojekyll
          ! grep -Eiq 'MoneyPrinterTurbo|harry0703|UPSTREAM-LICENSE' index.html editor.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
